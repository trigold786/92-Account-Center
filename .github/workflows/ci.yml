name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  GO_VERSION: "1.24"
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint Go Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Lint all Go services
        run: |
          for svc in api-gateway account-service auth-service notification-service \
                     credit-service compliance-service data-product-service config-service \
                     payment-service; do
            echo "==> Linting $svc"
            cd "$svc"
            golangci-lint run --timeout 5m ./...
            cd ..
          done

  test:
    name: Test Go Services
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: account_center_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run migrations
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: "postgres://postgres:postgres@localhost:5432/account_center_test?sslmode=disable"
        run: |
          cd db-migrations
          go run github.com/pressly/goose/v3/cmd/goose@latest up

      - name: Test all Go services
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: account_center_test
          REDIS_URL: "localhost:6379"
          JWT_SECRET: test-secret
          JWT_ACCESS_SECRET: test-access-secret
          JWT_REFRESH_SECRET: test-refresh-secret
        run: |
          for svc in api-gateway account-service auth-service notification-service \
                     credit-service compliance-service data-product-service config-service \
                     payment-service; do
            echo "==> Testing $svc"
            cd "$svc"
            go test -v -race -coverprofile=coverage.out ./...
            cd ..
          done

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: account_center
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run integration tests
        run: |
          cd tests/integration
          go test -v -count=1 -timeout 300s ./...
        env:
          TEST_PG_DSN: postgres://test:test@localhost:5432/account_center?sslmode=disable
          TEST_REDIS_ADDR: localhost:6379

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: -no-fail -fmt sarif -out results.sarif ./...
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - api-gateway
          - account-service
          - auth-service
          - notification-service
          - credit-service
          - compliance-service
          - data-product-service
          - config-service
          - payment-service
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web-ui:
    name: Build Web UI
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Build web-ui
        run: |
          cd web-ui
          npm ci
          npm run build

      - name: Build and push web-ui Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./web-ui
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web-ui:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web-ui:latest

  helm-lint:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm chart
        run: helm lint helm/account-center --strict

      - name: Helm template
        run: helm template account-center helm/account-center --debug

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: [build, build-web-ui, helm-lint]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev'
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy
        run: |
          helm upgrade --install account-center ./helm/account-center \
            --namespace account-center \
            --create-namespace \
            --wait \
            --timeout 5m \
            --set global.imageRegistry=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }} \
            --set services.api-gateway.image.tag=${{ github.sha }} \
            --set services.account-service.image.tag=${{ github.sha }} \
            --set services.auth-service.image.tag=${{ github.sha }} \
            --set services.notification-service.image.tag=${{ github.sha }} \
            --set services.credit-service.image.tag=${{ github.sha }} \
            --set services.compliance-service.image.tag=${{ github.sha }} \
            --set services.data-product-service.image.tag=${{ github.sha }} \
            --set services.config-service.image.tag=${{ github.sha }} \
            --set services.payment-service.image.tag=${{ github.sha }} \
            --set services.web-ui.image.tag=${{ github.sha }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [integration-test, security-scan, helm-lint]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy
        run: |
          helm upgrade --install account-center ./helm/account-center \
            --namespace account-center \
            --create-namespace \
            --wait \
            --timeout 5m \
            --set global.imageRegistry=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }} \
            --set services.api-gateway.image.tag=${{ github.sha }} \
            --set services.account-service.image.tag=${{ github.sha }} \
            --set services.auth-service.image.tag=${{ github.sha }} \
            --set services.notification-service.image.tag=${{ github.sha }} \
            --set services.credit-service.image.tag=${{ github.sha }} \
            --set services.compliance-service.image.tag=${{ github.sha }} \
            --set services.data-product-service.image.tag=${{ github.sha }} \
            --set services.config-service.image.tag=${{ github.sha }} \
            --set services.payment-service.image.tag=${{ github.sha }} \
            --set services.web-ui.image.tag=${{ github.sha }}

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [integration-test, security-scan, helm-lint]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy
        run: |
          helm upgrade --install account-center ./helm/account-center \
            --namespace account-center \
            --create-namespace \
            --wait \
            --timeout 5m \
            --set global.imageRegistry=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }} \
            --set services.api-gateway.image.tag=${{ github.sha }} \
            --set services.account-service.image.tag=${{ github.sha }} \
            --set services.auth-service.image.tag=${{ github.sha }} \
            --set services.notification-service.image.tag=${{ github.sha }} \
            --set services.credit-service.image.tag=${{ github.sha }} \
            --set services.compliance-service.image.tag=${{ github.sha }} \
            --set services.data-product-service.image.tag=${{ github.sha }} \
            --set services.config-service.image.tag=${{ github.sha }} \
            --set services.payment-service.image.tag=${{ github.sha }} \
            --set services.web-ui.image.tag=${{ github.sha }}
