name: AccountCenter
options:
  bundleIdPrefix: com.accountcenter
  deploymentTarget:
    iOS: "16.0"

settings:
  SWIFT_VERSION: "5.9"

targets:
  AccountCenter:
    type: application
    platform: iOS
    sources:
      - ios/AccountCenter
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.accountcenter.app
      INFOPLIST_FILE: ios/AccountCenter/Info.plist
      DEVELOPMENT_TEAM: ""
    dependencies: []

  AccountCenterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ios/AccountCenterTests
    settings:
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AccountCenter.app/AccountCenter"
      BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: AccountCenter
