    static_configs:
      - targets:
          - 'api-gateway:30300'
          - 'account-service:30301'
          - 'auth-service:30302'
          - 'notification-service:30311'
          - 'credit-service:30312'
          - 'compliance-service:30313'
          - 'data-product-service:30314'
          - 'payment-service:30316'
