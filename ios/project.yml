name: AccountCenter
options:
  bundleIdPrefix: com.accountcenter
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  AccountCenter:
    type: application
    platform: iOS
    sources:
      - path: AccountCenter
    info:
      path: AccountCenter/Info.plist
    settings:
      base:
        INFOPLIST_FILE: AccountCenter/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.accountcenter.app
        DEVELOPMENT_TEAM: ""
  AccountCenterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AccountCenterTests
    dependencies:
      - target: AccountCenter
