version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: account_center
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:8081
      AUTH_SERVICE_URL: http://auth-service:8082
      SMS_SERVICE_URL: http://sms-email-service:8083
      KYB_SERVICE_URL: http://kyb-service:8084
      AUDIT_SERVICE_URL: http://audit-log-service:8085
      RISK_SERVICE_URL: http://risk-detection-service:8086
      SESSION_SERVICE_URL: http://session-service:8087
      EMAIL_SERVICE_URL: http://email-service:8088
      DEVICE_SERVICE_URL: http://device-fingerprint-service:8089
    depends_on:
      - account-service
      - auth-service
      - sms-email-service

  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: account_center
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: account_center
      JWT_ACCESS_SECRET: access-secret-key-change-in-production
      JWT_REFRESH_SECRET: refresh-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy

  sms-email-service:
    build:
      context: ./sms-email-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"

  device-fingerprint-service:
    build:
      context: ./device-fingerprint-service
      dockerfile: Dockerfile
    ports:
      - "8089:8089"

  kyb-service:
    build:
      context: ./kyb-service
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: account_center
    depends_on:
      postgres:
        condition: service_healthy

  audit-log-service:
    build:
      context: ./audit-log-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: audit_db
      KAFKA_BROKERS: kafka:9092
      KAFKA_AUDIT_TOPIC: audit-logs
      KAFKA_GROUP_ID: audit-log-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  email-service:
    build:
      context: ./email-service
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: email-jwt-secret-change-in-production
    depends_on:
      redis:
        condition: service_healthy

  risk-detection-service:
    build:
      context: ./risk-detection-service
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: account_center
    depends_on:
      postgres:
        condition: service_healthy

  session-service:
    build:
      context: ./session-service
      dockerfile: Dockerfile
    ports:
      - "8087:8087"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: