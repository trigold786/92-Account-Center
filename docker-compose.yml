networks:
  app_network:
    driver: bridge
  01-neurocashengine_nce-network:
    external: true

services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: account_center
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always

  redis:
    image: redis:8.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
    restart: always

  db-migrate:
    build:
      context: ./db-migrations
      dockerfile: Dockerfile
    container_name: db-migrate
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-account_center}?sslmode=disable"
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
    command: ["up"]
    restart: "no"

  config-service:
    build:
      context: .
      dockerfile: config-service/Dockerfile
    container_name: config-service
    ports:
      - "30315:30315"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-account_center}
      PORT: "30315"
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:30315/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: always

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "30300:30300"
    environment:
      ACCOUNT_SERVICE_URL: "http://account-service:30301"
      AUTH_SERVICE_URL: "http://auth-service:30302"
      NOTIFICATION_SERVICE_URL: "http://notification-service:30311"
      CREDIT_SERVICE_URL: "http://credit-service:30312"
      COMPLIANCE_SERVICE_URL: "http://compliance-service:30313"
      DATA_PRODUCT_SERVICE_URL: "http://data-product-service:30314"
      CONFIG_SERVICE_URL: "http://config-service:30315"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      PORT: "30300"
    networks:
      - app_network
    depends_on:
      account-service:
        condition: service_started
      auth-service:
        condition: service_started
      notification-service:
        condition: service_started
      credit-service:
        condition: service_started
      compliance-service:
        condition: service_started
      data-product-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:30300/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always

  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    container_name: account-service
    ports:
      - "30301:30301"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-account_center}
      REDIS_URL: "redis:6379"
      CREDIT_SERVICE_URL: "http://credit-service:30312"
      CONFIG_SERVICE_URL: "http://config-service:30315"
      PORT: "30301"
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:30301/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "30302:30302"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-account_center}
      REDIS_URL: "redis:6379"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET required}
      CONFIG_SERVICE_URL: "http://config-service:30315"
      PORT: "30302"
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:30302/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "30311:30311"
    environment:
      REDIS_URL: "redis:6379"
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-""}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-""}
      SMTP_HOST: ${SMTP_HOST:-"smtp.163.com"}
      SMTP_PORT: ${SMTP_PORT:-"465"}
      SMTP_USERNAME: ${SMTP_USERNAME:-""}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-""}
      CONFIG_SERVICE_URL: "http://config-service:30315"
      PORT: "30311"
    networks:
      - app_network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:30311/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always

  credit-service:
    build:
      context: ./credit-service
      dockerfile: Dockerfile
    container_name: credit-service
    ports:
      - "30312:30312"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-account_center}
      REDIS_URL: "redis:6379"
      CONFIG_SERVICE_URL: "http://config-service:30315"
      PORT: "30312"
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:30312/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always

  compliance-service:
    build:
      context: ./compliance-service
      dockerfile: Dockerfile
    container_name: compliance-service
    ports:
      - "30313:30313"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-account_center}
      CONFIG_SERVICE_URL: "http://config-service:30315"
      REDIS_URL: "redis:6379"
      PORT: "30313"
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:30313/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always

  data-product-service:
    build:
      context: ./data-product-service
      dockerfile: Dockerfile
    container_name: data-product-service
    ports:
      - "30314:30314"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-account_center}
      CONFIG_SERVICE_URL: "http://config-service:30315"
      PORT: "30314"
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:30314/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: always

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.143.0
    container_name: victoriametrics
    ports:
      - "20010:8428"
    volumes:
      - vm_data:/victoria-metrics-data
      - ./monitoring/promscrape.yml:/etc/promscrape.yml
    command:
      - "--promscrape.config=/etc/promscrape.yml"
      - "--storageDataPath=/victoria-metrics-data"
      - "--retentionPeriod=30d"
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: always

  loki:
    image: grafana/loki:3.7.2
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: always

  grafana:
    image: grafana/grafana:13.0.1
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-lokiexplore-app
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/system-health.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/dashboards:/var/lib/grafana/dashboards
    networks:
      - app_network
    depends_on:
      loki:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: always

  jaeger:
    image: jaegertracing/all-in-one:1.65
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: true
    ports:
      - "16686:16686"
      - "4317:4317"
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: always

  config-management-ui:
    build:
      context: ./config-management-ui
      dockerfile: Dockerfile
    container_name: config-management-ui
    ports:
      - "30318:30318"
    networks:
      - app_network
    depends_on:
      config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:30318/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: always

  web-ui:
    image: nginx:alpine
    container_name: web-ui
    ports:
      - "30317:80"
    volumes:
      - ./web-ui/dist:/usr/share/nginx/html:ro
      - ./web-ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_network
      - 01-neurocashengine_nce-network
    depends_on:
      api-gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    restart: always

volumes:
  postgres_data:
  redis_data:
  vm_data:
