networks:
  app_network:
    driver: bridge

services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: account_center
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
    restart: always

  db-migrate:
    build:
      context: ./db-migrations
      dockerfile: Dockerfile
    container_name: db-migrate
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/account_center?sslmode=disable"
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
    command: ["up"]
    restart: "no"

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "30300:30300"
    environment:
      ACCOUNT_SERVICE_URL: "http://account-service:30301"
      AUTH_SERVICE_URL: "http://auth-service:30302"
      NOTIFICATION_SERVICE_URL: "http://notification-service:30311"
      CREDIT_SERVICE_URL: "http://credit-service:30312"
      COMPLIANCE_SERVICE_URL: "http://compliance-service:30313"
      DATA_PRODUCT_SERVICE_URL: "http://data-product-service:30314"
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      PORT: "30300"
    networks:
      - app_network
    depends_on:
      account-service:
        condition: service_started
      auth-service:
        condition: service_started
      notification-service:
        condition: service_started
      credit-service:
        condition: service_started
      compliance-service:
        condition: service_started
      data-product-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:30300/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always

  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    container_name: account-service
    ports:
      - "30301:30301"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: account_center
      REDIS_URL: "redis:6379"
      PORT: "30301"
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:30301/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "30302:30302"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: account_center
      REDIS_URL: "redis:6379"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret}
      PORT: "30302"
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:30302/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "30311:30311"
    environment:
      REDIS_URL: "redis:6379"
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-""}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-""}
      SMTP_HOST: ${SMTP_HOST:-"smtp.163.com"}
      SMTP_PORT: ${SMTP_PORT:-"465"}
      SMTP_USERNAME: ${SMTP_USERNAME:-""}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-""}
      PORT: "30311"
    networks:
      - app_network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:30311/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always

  credit-service:
    build:
      context: ./credit-service
      dockerfile: Dockerfile
    container_name: credit-service
    ports:
      - "30312:30312"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: account_center
      PORT: "30312"
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:30312/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always

  compliance-service:
    build:
      context: ./compliance-service
      dockerfile: Dockerfile
    container_name: compliance-service
    ports:
      - "30313:30313"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: account_center
      REDIS_URL: "redis:6379"
      PORT: "30313"
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:30313/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always

  data-product-service:
    build:
      context: ./data-product-service
      dockerfile: Dockerfile
    container_name: data-product-service
    ports:
      - "30314:30314"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:30314/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: always

volumes:
  postgres_data:
  redis_data:
