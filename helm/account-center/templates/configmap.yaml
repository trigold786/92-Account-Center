apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "account-center.fullname" . }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "account-center.labels" . | nindent 4 }}
data:
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  TZ: "Asia/Shanghai"
  {{- if and .Values.postgresql.enabled }}
  DB_HOST: "{{ .Release.Name }}-postgresql"
  DB_PORT: "5432"
  DB_USER: "postgres"
  DB_NAME: {{ .Values.postgresql.auth.database | default "account_center" | quote }}
  {{- end }}
  {{- if and .Values.redis.enabled }}
  REDIS_URL: "{{ .Release.Name }}-redis-master:6379"
  {{- end }}
