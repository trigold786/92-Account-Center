    replicaCount: 1
    image:
      repository: account-center/data-product-service
      tag: "2.0.0"
    port: 30314
    resources:
      requests:
        cpu: 125m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    hpa:
      enabled: false
    env:
      DB_HOST: "{{ .Release.Name }}-postgresql"
      DB_PORT: "5432"
      DB_USER: postgres
      DB_NAME: account_center
    envSecrets:
      DB_PASSWORD: db-password

  config-service:
    enabled: true
    replicaCount: 1
    image:
      repository: account-center/config-service
      tag: "2.0.0"
    port: 30315
    resources:
      requests:
        cpu: 125m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    hpa:
      enabled: false
    env:
      DB_HOST: "{{ .Release.Name }}-postgresql"
      DB_PORT: "5432"
      DB_USER: postgres
      DB_NAME: account_center
    envSecrets:
      DB_PASSWORD: db-password

  payment-service:
    enabled: true
    replicaCount: 1
    image:
      repository: account-center/payment-service
      tag: "2.0.0"
    port: 30316
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    hpa:
      enabled: false
    env:
      DB_HOST: "{{ .Release.Name }}-postgresql"
