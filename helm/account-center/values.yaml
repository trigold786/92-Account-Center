  web-ui:
    enabled: true
    replicaCount: 1
    image:
      repository: account-center/web-ui
      tag: "2.0.0"
    port: 80
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    hpa:
      enabled: false
    env: {}
    envSecrets: {}
